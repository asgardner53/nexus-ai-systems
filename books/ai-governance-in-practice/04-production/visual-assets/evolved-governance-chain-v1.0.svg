<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
<title id="title">Evolved Governance Chain</title>
<desc id="desc">A seven-stage governance traceability chain: Purpose, Authority, Boundary, Execution, Evidence, Evaluation and Learning. Learning feeds back to adjust earlier governance decisions. Assurance is shown outside the chain as a conclusion drawn from evaluation, not another link.</desc>
<style>.title{font:700 66px Arial,sans-serif;fill:#082d4a}.h{font:700 28px Arial,sans-serif;fill:white}.q{font:700 21px Arial,sans-serif;fill:#101820}.loop{font:700 27px Arial,sans-serif;fill:#082d4a}.assure{font:700 31px Arial,sans-serif;fill:white}.note{font:italic 700 28px Arial,sans-serif;fill:#082d4a}</style>
<rect width="1800" height="1000" fill="white"/>
<text x="900" y="72" text-anchor="middle" class="title">Evolved Governance Chain</text><rect x="585" y="98" width="630" height="9" rx="4" fill="#e9a21b"/>
<g>
<rect x="20" y="180" width="230" height="250" rx="35" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M20 220Q20 180 60 180H210Q250 180 250 220V285H20Z" fill="#0c4770"/><text x="135" y="245" text-anchor="middle" class="h">PURPOSE</text><text x="135" y="335" text-anchor="middle" class="q">Why are we</text><text x="135" y="365" text-anchor="middle" class="q">doing this?</text>
<rect x="270" y="180" width="230" height="250" rx="35" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M270 220Q270 180 310 180H460Q500 180 500 220V285H270Z" fill="#087f98"/><text x="385" y="245" text-anchor="middle" class="h">AUTHORITY</text><text x="385" y="335" text-anchor="middle" class="q">What has been</text><text x="385" y="365" text-anchor="middle" class="q">authorised?</text>
<rect x="520" y="180" width="230" height="250" rx="35" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M520 220Q520 180 560 180H710Q750 180 750 220V285H520Z" fill="#148531"/><text x="635" y="245" text-anchor="middle" class="h">BOUNDARY</text><text x="635" y="335" text-anchor="middle" class="q">Where must</text><text x="635" y="365" text-anchor="middle" class="q">authority stop?</text>
<rect x="770" y="180" width="230" height="250" rx="35" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M770 220Q770 180 810 180H960Q1000 180 1000 220V285H770Z" fill="#087f98"/><text x="885" y="245" text-anchor="middle" class="h">EXECUTION</text><text x="885" y="335" text-anchor="middle" class="q">What actually</text><text x="885" y="365" text-anchor="middle" class="q">happened?</text>
<rect x="1020" y="180" width="230" height="250" rx="35" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M1020 220Q1020 180 1060 180H1210Q1250 180 1250 220V285H1020Z" fill="#087f98"/><text x="1135" y="245" text-anchor="middle" class="h">EVIDENCE</text><text x="1135" y="335" text-anchor="middle" class="q">What record</text><text x="1135" y="365" text-anchor="middle" class="q">survives?</text>
<rect x="1270" y="180" width="230" height="250" rx="35" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M1270 220Q1270 180 1310 180H1460Q1500 180 1500 220V285H1270Z" fill="#148531"/><text x="1385" y="245" text-anchor="middle" class="h">EVALUATION</text><text x="1385" y="335" text-anchor="middle" class="q">What does the</text><text x="1385" y="365" text-anchor="middle" class="q">evidence show?</text>
<rect x="1520" y="180" width="230" height="250" rx="35" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M1520 220Q1520 180 1560 180H1710Q1750 180 1750 220V285H1520Z" fill="#0c4770"/><text x="1635" y="245" text-anchor="middle" class="h">LEARNING</text><text x="1635" y="335" text-anchor="middle" class="q">What must</text><text x="1635" y="365" text-anchor="middle" class="q">change?</text>
</g>
<g fill="#e9a21b"><path d="M235 275h45l22 28-22 28h-45l22-28z"/><path d="M485 275h45l22 28-22 28h-45l22-28z"/><path d="M735 275h45l22 28-22 28h-45l22-28z"/><path d="M985 275h45l22 28-22 28h-45l22-28z"/><path d="M1235 275h45l22 28-22 28h-45l22-28z"/><path d="M1485 275h45l22 28-22 28h-45l22-28z"/></g>
<path d="M1635 430V505Q1635 550 1585 550H170Q125 550 125 505V445" fill="none" stroke="#e9a21b" stroke-width="15"/><polygon points="125,425 100,465 150,465" fill="#e9a21b"/><polygon points="385,425 360,465 410,465" fill="#e9a21b"/><polygon points="635,425 610,465 660,465" fill="#e9a21b"/>
<rect x="580" y="515" width="640" height="70" rx="35" fill="#fff4d8" stroke="#e9a21b" stroke-width="4"/><text x="900" y="560" text-anchor="middle" class="loop">GOVERNANCE ADAPTATION</text><text x="900" y="625" text-anchor="middle" style="font:23px Arial,sans-serif;fill:#082d4a">Learning feeds back to adjust purpose, authority and boundaries.</text>
<path d="M1385 430V690" stroke="#082d4a" stroke-width="8" stroke-dasharray="10 12"/><polygon points="1385,710 1365,675 1405,675" fill="#082d4a"/>
<rect x="300" y="710" width="1200" height="100" rx="45" fill="#082d4a" stroke="#e9a21b" stroke-width="6"/><text x="900" y="772" text-anchor="middle" class="assure">ASSURANCE — a conclusion drawn from evaluation, not another link in the chain.</text>
<rect x="100" y="860" width="1600" height="80" rx="30" fill="white" stroke="#e9a21b" stroke-width="4"/><text x="900" y="910" text-anchor="middle" class="note">Successful execution does not eliminate the need for assurance.</text>
</svg>