name: Build AI Governance EPUB v0.1
on:
  workflow_dispatch:
  push:
    branches: [book-intelligence-engine-v0.1]
    paths:
      - 'books/ai-governance-in-practice/04-production/epub/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc librsvg2-bin
          curl -L -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q /tmp/epubcheck.zip -d /tmp
      - name: Prepare manuscript and visual fallbacks
        run: |
          cd books/ai-governance-in-practice
          python 04-production/epub/scripts/prepare_epub.py
          for f in 04-production/visual-assets/*-v1.0.svg; do
            n=$(basename "$f" .svg)
            rsvg-convert -w 1600 "$f" -o "04-production/epub/build/images/$n.png"
          done
      - name: Build reflowable EPUB
        run: |
          cd books/ai-governance-in-practice
          pandoc 04-production/epub/metadata.yaml 04-production/epub/build/manuscript-production.md \
            --from markdown --to epub3 --toc --toc-depth=1 --split-level=1 \
            --css=04-production/epub/epub.css \
            --resource-path=04-production/epub/build \
            --output=04-production/epub/build/AI_Governance_in_Practice_EPUB_v0.1.epub
      - name: Validate EPUB
        run: |
          java -jar /tmp/epubcheck-5.2.1/epubcheck.jar books/ai-governance-in-practice/04-production/epub/build/AI_Governance_in_Practice_EPUB_v0.1.epub | tee books/ai-governance-in-practice/04-production/epub/build/epubcheck-v0.1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ai-governance-in-practice-epub-v0.1
          path: |
            books/ai-governance-in-practice/04-production/epub/build/AI_Governance_in_Practice_EPUB_v0.1.epub
            books/ai-governance-in-practice/04-production/epub/build/epubcheck-v0.1.txt
