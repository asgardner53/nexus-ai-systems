name: Workplace AI Research Agent skeleton checks
on:
  pull_request:
    paths:
      - 'agents/workplace-ai-research-agent/**'
      - '.github/workflows/workplace-ai-research-agent.yml'
  push:
    paths:
      - 'agents/workplace-ai-research-agent/**'
      - '.github/workflows/workplace-ai-research-agent.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/workplace-ai-research-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
