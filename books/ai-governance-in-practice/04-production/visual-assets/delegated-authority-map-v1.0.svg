<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1067" viewBox="0 0 1600 1067" role="img" aria-labelledby="title desc">
<title id="title">Delegated Authority Map</title>
<desc id="desc">Accountability spans a five-stage delegated authority chain: Function, Permission, Boundary, Control and Recourse. Capability does not confer authority and delegation does not transfer accountability.</desc>
<style>.title{font:700 64px Arial,sans-serif;fill:#082d4a}.h{font:700 34px Arial,sans-serif;fill:white}.q{font:700 25px Arial,sans-serif;fill:#101820}.banner{font:700 52px Arial,sans-serif;fill:white}.sub{font:28px Arial,sans-serif;fill:white}.note{font:italic 700 27px Arial,sans-serif;fill:#082d4a}</style>
<rect width="1600" height="1067" fill="white"/>
<text x="800" y="78" text-anchor="middle" class="title">Delegated Authority Map</text><rect x="500" y="102" width="600" height="9" rx="4" fill="#e9a21b"/>
<rect x="95" y="190" width="1410" height="175" rx="75" fill="#082d4a" stroke="#e9a21b" stroke-width="6"/>
<text x="800" y="270" text-anchor="middle" class="banner">ACCOUNTABILITY</text><text x="800" y="320" text-anchor="middle" class="sub">Remains with the organisation throughout the full chain of delegated authority.</text>
<g stroke="#e9a21b" stroke-width="5" fill="none"><path d="M95 300H55V435"/><path d="M1505 300H1545V435"/></g>
<g>
<rect x="25" y="435" width="290" height="345" rx="40" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M25 475Q25 435 65 435H275Q315 435 315 475V570H25Z" fill="#0c4770"/><text x="170" y="515" text-anchor="middle" class="h">FUNCTION</text><text x="170" y="635" text-anchor="middle" class="q">What is the AI</text><text x="170" y="670" text-anchor="middle" class="q">participating in</text><text x="170" y="705" text-anchor="middle" class="q">or doing?</text>
<rect x="340" y="435" width="290" height="345" rx="40" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M340 475Q340 435 380 435H590Q630 435 630 475V570H340Z" fill="#087f98"/><text x="485" y="515" text-anchor="middle" class="h">PERMISSION</text><text x="485" y="645" text-anchor="middle" class="q">What is it</text><text x="485" y="680" text-anchor="middle" class="q">authorised to do?</text>
<rect x="655" y="435" width="290" height="345" rx="40" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M655 475Q655 435 695 435H905Q945 435 945 475V570H655Z" fill="#148531"/><text x="800" y="515" text-anchor="middle" class="h">BOUNDARY</text><text x="800" y="645" text-anchor="middle" class="q">Where must that</text><text x="800" y="680" text-anchor="middle" class="q">authority stop?</text>
<rect x="970" y="435" width="290" height="345" rx="40" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M970 475Q970 435 1010 435H1220Q1260 435 1260 475V570H970Z" fill="#0d7d79"/><text x="1115" y="515" text-anchor="middle" class="h">CONTROL</text><text x="1115" y="630" text-anchor="middle" class="q">How is the</text><text x="1115" y="665" text-anchor="middle" class="q">boundary enforced</text><text x="1115" y="700" text-anchor="middle" class="q">in operation?</text>
<rect x="1285" y="435" width="290" height="345" rx="40" fill="#f4f5f6" stroke="#ddd" stroke-width="3"/><path d="M1285 475Q1285 435 1325 435H1535Q1575 435 1575 475V570H1285Z" fill="#086c5d"/><text x="1430" y="515" text-anchor="middle" class="h">RECOURSE</text><text x="1430" y="625" text-anchor="middle" class="q">What happens when</text><text x="1430" y="660" text-anchor="middle" class="q">action is wrong,</text><text x="1430" y="695" text-anchor="middle" class="q">contested or harmful?</text>
</g>
<g fill="#e9a21b"><path d="M300 565h50l25 30-25 30h-50l25-30z"/><path d="M615 565h50l25 30-25 30h-50l25-30z"/><path d="M930 565h50l25 30-25 30h-50l25-30z"/><path d="M1245 565h50l25 30-25 30h-50l25-30z"/></g>
<rect x="65" y="875" width="1470" height="85" rx="30" fill="white" stroke="#e9a21b" stroke-width="4"/><text x="800" y="928" text-anchor="middle" class="note">Capability does not confer authority. Delegation does not transfer accountability.</text>
</svg>